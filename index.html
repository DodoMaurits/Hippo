<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦛 Hippo Knows</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="hippo-face big" aria-hidden="true">🦛</div>
      <h1>Hippo Knows</h1>
      <p class="subtitle">Build your own lists and train your hippo! 🌊</p>
      <form id="authForm">
        <input type="email" id="authEmail" placeholder="Email" autocomplete="username" required>
        <input type="password" id="authPass" placeholder="Password" autocomplete="current-password" required>
        <input type="password" id="authPass2" placeholder="Repeat password" class="hidden">
        <p class="auth-msg" id="authMsg"></p>
      </form>
      <div class="auth-buttons">
        <button class="btn" id="btnLogin">Log in</button>
        <button class="btn secondary" id="btnRegister">Create account</button>
      </div>
    </div>
  </div>

  <!-- APP (identiek aan je huidige versie, alleen script-tag onderaan wijzigt) -->
  <div class="container hidden" id="app">
    <!-- ... hier staat jouw bestaande header/tabs/panelen ongewijzigd ... -->
  </div>

  <div class="water" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,60 C240,110 480,10 720,60 C960,110 1200,10 1440,60 L1440,120 L0,120 Z"></path>
    </svg>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
