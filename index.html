<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦛 Hippo Woorden — 2 talen + overhoor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="container">
    <header class="hippo-header">
      <div class="hippo-face" aria-hidden="true">🦛</div>
      <div>
        <h1>Hippo Woorden</h1>
        <p class="subtitle">Duik in je woordenlijst in 2 talen en overhoor jezelf! 🌊</p>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="list">🌿 Mijn lijst</button>
      <button class="tab" data-tab="quiz-mc">🫧 Meerkeuze</button>
      <button class="tab" data-tab="quiz-type">⌨️ Typen</button>
      <button class="tab" data-tab="flash">🃏 Flashcards</button>
    </div>

    <!-- LIJST -->
    <div class="panel active" id="panel-list">
      <div class="list-header">
        <input type="text" id="col1name" placeholder="Naam taal 1 (bv. Nederlands)" value="Nederlands">
        <input type="text" id="col2name" placeholder="Naam taal 2 (bv. Engels)" value="Engels">
        <button class="btn" id="addRow">+ Woord toevoegen</button>
        <button class="btn secondary" id="clearList">Lijst legen</button>
      </div>
      <table>
        <thead>
          <tr><th id="th1">Nederlands</th><th id="th2">Engels</th><th></th></tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
      <p class="empty" id="emptyMsg">De poel is nog leeg… voeg hierboven je eerste woord toe! 🦛</p>
    </div>

    <!-- MEERKEUZE -->
    <div class="panel" id="panel-quiz-mc">
      <div class="quiz-controls">
        <select id="mcDirection">
          <option value="1to2">Taal 1 → Taal 2</option>
          <option value="2to1">Taal 2 → Taal 1</option>
        </select>
        <label><input type="checkbox" id="mcShuffle" checked> Willekeurige volgorde</label>
        <button class="btn" id="mcStart">▶ Start overhoring</button>
      </div>
      <div class="score-bar"><span id="mcScore">Score: 0/0</span><span id="mcCount"></span></div>
      <div class="progress"><div id="mcProgress"></div></div>
      <div class="quiz-box">
        <div class="prompt" id="mcPrompt">Druk op “Start overhoring”</div>
        <div class="hint" id="mcHint"></div>
        <div class="choices" id="mcChoices"></div>
        <div class="feedback" id="mcFeedback"></div>
      </div>
    </div>

    <!-- TYPEN -->
    <div class="panel" id="panel-quiz-type">
      <div class="quiz-controls">
        <select id="typeDirection">
          <option value="1to2">Taal 1 → Taal 2</option>
          <option value="2to1">Taal 2 → Taal 1</option>
        </select>
        <label><input type="checkbox" id="typeShuffle" checked> Willekeurige volgorde</label>
        <button class="btn" id="typeStart">▶ Start overhoring</button>
      </div>
      <div class="score-bar"><span id="typeScore">Score: 0/0</span><span id="typeCount"></span></div>
      <div class="progress"><div id="typeProgress"></div></div>
      <div class="quiz-box">
        <div class="prompt" id="typePrompt">Druk op “Start overhoring”</div>
        <div class="hint" id="typeHint"></div>
        <input type="text" class="answer-input" id="typeInput" placeholder="Typ de vertaling…" autocomplete="off">
        <div class="feedback" id="typeFeedback"></div>
      </div>
    </div>

    <!-- FLASHCARDS -->
    <div class="panel" id="panel-flash">
      <div class="quiz-controls">
        <label><input type="checkbox" id="flashShuffle" checked> Willekeurige volgorde</label>
        <button class="btn" id="flashStart">▶ Start flashcards</button>
      </div>
      <div class="score-bar"><span id="flashCount">Kaart 0/0</span></div>
      <div class="flashcard" id="flashCard">
        <div class="flashcard-inner">
          <div class="face front" id="flashFront">🦛</div>
          <div class="face back" id="flashBack">…</div>
        </div>
      </div>
      <p class="hint" style="text-align:center">Klik op de kaart om te draaien</p>
      <div class="flash-nav">
        <button class="btn secondary" id="flashPrev">← Vorige</button>
        <button class="btn" id="flashNext">Volgende →</button>
      </div>
    </div>
  </div>

  <div class="water" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,60 C240,110 480,10 720,60 C960,110 1200,10 1440,60 L1440,120 L0,120 Z"></path>
    </svg>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
