<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoordenLijst — 2 talen + overhoor</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #273549;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --good: #4ade80;
    --bad: #f87171;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 64px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 1.8rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--muted); margin-bottom: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.95rem;
    transition: all .15s;
  }
  .tab.active { background: var(--accent); color: #082f49; font-weight: 600; border-color: var(--accent); }
  .panel {
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .panel.active { display: block; }

  /* Lijst-weergave */
  .list-header { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  input[type="text"], select {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: #082f49;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); padding: 5px 10px; font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 0.85rem; padding: 8px 10px; border-bottom: 2px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td input { width: 100%; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }

  /* Overhoor */
  .quiz-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .quiz-box { text-align: center; padding: 30px 10px; }
  .prompt {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    min-height: 2.6rem;
  }
  .hint { color: var(--muted); margin-bottom: 24px; min-height: 1.2rem; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; margin: 0 auto; }
  @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
  .choice {
    background: var(--panel2);
    border: 2px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.05rem;
    transition: all .12s;
  }
  .choice:hover { border-color: var(--accent); }
  .choice.correct { border-color: var(--good); background: rgba(74, 222, 128, .15); }
  .choice.wrong { border-color: var(--bad); background: rgba(248, 113, 113, .15); }
  .answer-input {
    font-size: 1.3rem;
    text-align: center;
    max-width: 420px;
    padding: 12px;
  }
  .feedback { min-height: 1.6rem; margin-top: 16px; font-weight: 600; font-size: 1.1rem; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .score-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; color: var(--muted); font-size: 0.95rem;
  }
  .progress { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width .3s; }

  /* Flashcards */
  .flashcard {
    max-width: 480px; margin: 20px auto; perspective: 1000px; cursor: pointer;
  }
  .flashcard-inner {
    position: relative; height: 220px; transition: transform .5s; transform-style: preserve-3d;
  }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel2); border: 2px solid var(--border); border-radius: 16px;
    font-size: 1.8rem; font-weight: 700; padding: 20px; text-align: center;
    backface-visibility: hidden;
  }
  .face.back { transform: rotateY(180deg); border-color: var(--accent); }
  .flash-nav { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>📚 WoordenLijst</h1>
  <p class="subtitle">Maak lijsten in 2 talen en overhoor jezelf er meteen mee.</p>

  <div class="tabs">
    <button class="tab active" data-tab="list">📝 Mijn lijst</button>
    <button class="tab" data-tab="quiz-mc">✅ Meerkeuze</button>
    <button class="tab" data-tab="quiz-type">⌨️ Typen</button>
    <button class="tab" data-tab="flash">🃏 Flashcards</button>
  </div>

  <!-- LIJST -->
  <div class="panel active" id="panel-list">
    <div class="list-header">
      <input type="text" id="col1name" placeholder="Naam taal 1 (bv. Nederlands)" value="Nederlands">
      <input type="text" id="col2name" placeholder="Naam taal 2 (bv. Engels)" value="Engels">
      <button class="btn" id="addRow">+ Rij toevoegen</button>
      <button class="btn secondary" id="clearList">Lijst legen</button>
    </div>
    <table>
      <thead>
        <tr><th id="th1">Nederlands</th><th id="th2">Engels</th><th></th></tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
    <p class="empty" id="emptyMsg">Nog geen woorden. Voeg hierboven je eerste rij toe! 👆</p>
  </div>

  <!-- MEERKEuze -->
  <div class="panel" id="panel-quiz-mc">
    <div class="quiz-controls">
      <select id="mcDirection">
        <option value="1to2">Taal 1 → Taal 2</option>
        <option value="2to1">Taal 2 → Taal 1</option>
      </select>
      <label><input type="checkbox" id="mcShuffle" checked> Willekeurige volgorde</label>
      <button class="btn" id="mcStart">▶ Start overhoring</button>
    </div>
    <div class="score-bar"><span id="mcScore">Score: 0/0</span><span id="mcCount"></span></div>
    <div class="progress"><div id="mcProgress"></div></div>
    <div class="quiz-box">
      <div class="prompt" id="mcPrompt">Druk op “Start overhoring”</div>
      <div class="hint" id="mcHint"></div>
      <div class="choices" id="mcChoices"></div>
      <div class="feedback" id="mcFeedback"></div>
    </div>
  </div>

  <!-- TYPEN -->
  <div class="panel" id="panel-quiz-type">
    <div class="quiz-controls">
      <select id="typeDirection">
        <option value="1to2">Taal 1 → Taal 2</option>
        <option value="2to1">Taal 2 → Taal 1</option>
      </select>
      <label><input type="checkbox" id="typeShuffle" checked> Willekeurige volgorde</label>
      <button class="btn" id="typeStart">▶ Start overhoring</button>
    </div>
    <div class="score-bar"><span id="typeScore">Score: 0/0</span><span id="typeCount"></span></div>
    <div class="progress"><div id="typeProgress"></div></div>
    <div class="quiz-box">
      <div class="prompt" id="typePrompt">Druk op “Start overhoring”</div>
      <div class="hint" id="typeHint"></div>
      <input type="text" class="answer-input" id="typeInput" placeholder="Typ de vertaling…" autocomplete="off">
      <div class="feedback" id="typeFeedback"></div>
    </div>
  </div>

  <!-- FLASHCARDS -->
  <div class="panel" id="panel-flash">
    <div class="quiz-controls">
      <label><input type="checkbox" id="flashShuffle" checked> Willekeurige volgorde</label>
      <button class="btn" id="flashStart">▶ Start flashcards</button>
    </div>
    <div class="score-bar"><span id="flashCount">Kaart 0/0</span></div>
    <div class="flashcard" id="flashCard">
      <div class="flashcard-inner">
        <div class="face front" id="flashFront">…</div>
        <div class="face back" id="flashBack">…</div>
      </div>
    </div>
    <p class="hint" style="text-align:center">Klik op de kaart om te draaien</p>
    <div class="flash-nav">
      <button class="btn secondary" id="flashPrev">← Vorige</button>
      <button class="btn" id="flashNext">Volgende →</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const STORAGE_KEY = "woordenlijst-data-v1";
  const COLNAMES_KEY = "woordenlijst-colnames-v1";

  let words = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }
  function saveColNames() {
    localStorage.setItem(COLNAMES_KEY, JSON.stringify({
      c1: $("col1name").value, c2: $("col2name").value
    }));
  }
  function loadColNames() {
    try {
      const raw = localStorage.getItem(COLNAMES_KEY);
      if (raw) {
        const n = JSON.parse(raw);
        $("col1name").value = n.c1 || "Nederlands";
        $("col2name").value = n.c2 || "Engels";
      }
    } catch (e) {}
    updateHeaders();
  }
  function updateHeaders() {
    $("th1").textContent = $("col1name").value || "Taal 1";
    $("th2").textContent = $("col2name").value || "Taal 2";
  }

  // ---------- Tabs ----------
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      tab.classList.add("active");
      $("panel-" + tab.dataset.tab).classList.add("active");
    });
  });

  // ---------- Lijst ----------
  function renderList() {
    const body = $("listBody");
    body.innerHTML = "";
    words.forEach((w, i) => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td");
      const td2 = document.createElement("td");
      const tdDel = document.createElement("td");
      const in1 = document.createElement("input");
      const in2 = document.createElement("input");
      in1.type = "text"; in1.value = w.a; in1.placeholder = "woord in taal 1";
      in2.type = "text"; in2.value = w.b; in2.placeholder = "woord in taal 2";
      in1.addEventListener("input", () => { words[i].a = in1.value; save(); });
      in2.addEventListener("input", () => { words[i].b = in2.value; save(); });
      const del = document.createElement("button");
      del.className = "btn danger";
      del.textContent = "✕";
      del.addEventListener("click", () => { words.splice(i, 1); save(); renderList(); });
      td1.appendChild(in1); td2.appendChild(in2); tdDel.appendChild(del);
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(tdDel);
      body.appendChild(tr);
    });
    $("emptyMsg").style.display = words.length ? "none" : "block";
  }

  $("addRow").addEventListener("click", () => {
    words.push({ a: "", b: "" });
    save(); renderList();
    const inputs = $("listBody").querySelectorAll("tr:last-child input");
    if (inputs[0]) inputs[0].focus();
  });
  $("clearList").addEventListener("click", () => {
    if (words.length && confirm("Weet je zeker dat je de hele lijst wilt legen?")) {
      words = []; save(); renderList();
    }
  });
  $("col1name").addEventListener("input", () => { saveColNames(); updateHeaders(); });
  $("col2name").addEventListener("input", () => { saveColNames(); updateHeaders(); });

  // ---------- Hulpfuncties quiz ----------
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function normalize(s) {
    return s.trim().toLowerCase().replace(/\s+/g, " ");
  }
  function getPairs(direction) {
    return words
      .filter((w) => w.a.trim() && w.b.trim())
      .map((w) => direction === "2to1" ? { prompt: w.b, answer: w.a } : { prompt: w.a, answer: w.b });
  }
  function updateScore(el, scoreEl, countEl, total, done) {
    el.textContent = "Score: " + score + "/" + done;
    countEl.textContent = done + "/" + total;
    el.style.width = total ? (done / total * 100) + "%" : "0%";
  }

  // ---------- Meerkeuze ----------
  let mc = { queue: [], idx: 0, score: 0, locked: false };
  function mcStart() {
    const dir = $("mcDirection").value;
    let pool = getPairs(dir);
    if (!pool.length) { $("mcPrompt").textContent = "Voeg eerst woorden toe in ‘Mijn lijst’!"; return; }
    if ($("mcShuffle").checked) pool = shuffle(pool);
    mc = { queue: pool, idx: 0, score: 0, locked: false };
    mcNext();
  }
  function mcNext() {
    $("mcFeedback").textContent = "";
    $("mcFeedback").className = "feedback";
    if (mc.idx >= mc.queue.length) {
      const pct = mc.queue.length ? Math.round(mc.score / mc.queue.length * 100) : 0;
      $("mcPrompt").textContent = "🎉 Klaar! Je score: " + mc.score + "/" + mc.queue.length + " (" + pct + "%)";
      $("mcHint").textContent = pct >= 80 ? "Top! 🌟" : pct >= 50 ? "Goed bezig, nog even oefenen 💪" : "Tip: oefen de flashcards eerst 🃏";
      $("mcChoices").innerHTML = "";
      updateScore($("mcProgress"), $("mcScore"), $("mcCount"), mc.queue.length, mc.queue.length);
      return;
    }
    mc.locked = false;
    const item = mc.queue[mc.idx];
    $("mcPrompt").textContent = item.prompt;
    $("mcHint").textContent = "Kies de juiste vertaling";
    const wrong = shuffle(mc.queue.filter((x) => x.answer !== item.answer)).slice(0, 3)
      .map((x) => x.answer);
    const options = shuffle([item.answer, ...wrong]);
    const box = $("mcChoices");
    box.innerHTML = "";
    options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        if (mc.locked) return;
        mc.locked = true;
        if (normalize(opt) === normalize(item.answer)) {
          btn.classList.add("correct");
          mc.score++;
          $("mcFeedback").textContent = "✔ Goed!";
          $("mcFeedback").classList.add("good");
        } else {
          btn.classList.add("wrong");
          $("mcFeedback").textContent = "✘ Nee, het juiste antwoord was: " + item.answer;
          $("mcFeedback").classList.add("bad");
          box.querySelectorAll(".choice").forEach((b) => {
            if (normalize(b.textContent) === normalize(item.answer)) b.classList.add("correct");
          });
        }
        updateScore($("mcProgress"), $("mcScore"), $("mcCount"), mc.queue.length, mc.idx + 1);
        mc.idx++;
        setTimeout(mcNext, 1200);
      });
      box.appendChild(btn);
    });
    updateScore($("mcProgress"), $("mcScore"), $("mcCount"), mc.queue.length, mc.idx);
  }
  $("mcStart").addEventListener("click", mcStart);

  // ---------- Typen ----------
  let ty = { queue: [], idx: 0, score: 0 };
  function typeStart() {
    const dir = $("typeDirection").value;
    let pool = getPairs(dir);
    if (!pool.length) { $("typePrompt").textContent = "Voeg eerst woorden toe in ‘Mijn lijst’!"; return; }
    if ($("typeShuffle").checked) pool = shuffle(pool);
    ty = { queue: pool, idx: 0, score: 0 };
    typeNext();
  }
  function typeNext() {
    $("typeFeedback").textContent = "";
    $("typeFeedback").className = "feedback";
    $("typeInput").value = "";
    if (ty.idx >= ty.queue.length) {
      const pct = ty.queue.length ? Math.round(ty.score / ty.queue.length * 100) : 0;
      $("typePrompt").textContent = "🎉 Klaar! Je score: " + ty.score + "/" + ty.queue.length + " (" + pct + "%)";
      $("typeHint").textContent = "";
      $("typeInput").style.display = "none";
      updateScore($("typeProgress"), $("typeScore"), $("typeCount"), ty.queue.length, ty.queue.length);
      return;
    }
    $("typeInput").style.display = "inline-block";
    const item = ty.queue[ty.idx];
    $("typePrompt").textContent = item.prompt;
    $("typeHint").textContent = "Typ de vertaling en druk op Enter";
    updateScore($("typeProgress"), $("typeScore"), $("typeCount"), ty.queue.length, ty.idx);
    $("typeInput").focus();
  }
  function typeCheck() {
    const item = ty.queue[ty.idx];
    if (!item) return;
    const given = $("typeInput").value;
    if (!given.trim()) return;
    if (normalize(given) === normalize(item.answer)) {
      ty.score++;
      $("typeFeedback").textContent = "✔ Goed!";
      $("typeFeedback").classList.add("good");
    } else {
      $("typeFeedback").textContent = "✘ Bijna! Het was: " + item.answer;
      $("typeFeedback").classList.add("bad");
    }
    ty.idx++;
    updateScore($("typeProgress"), $("typeScore"), $("typeCount"), ty.queue.length, ty.idx);
    setTimeout(typeNext, 1200);
  }
  $("typeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") typeCheck(); });
  $("typeStart").addEventListener("click", typeStart);

  // ---------- Flashcards ----------
  let fl = { queue: [], idx: 0 };
  function flashStart() {
    let pool = getPairs("1to2");
    if (!pool.length) { $("flashFront").textContent = "Voeg eerst woorden toe!"; return; }
    if ($("flashShuffle").checked) pool = shuffle(pool);
    fl = { queue: pool, idx: 0 };
    flashShow();
  }
  function flashShow() {
    $("flashCard").classList.remove("flipped");
    const item = fl.queue[fl.idx];
    $("flashFront").textContent = item ? item.prompt : "…";
    $("flashBack").textContent = item ? item.answer : "…";
    $("flashCount").textContent = "Kaart " + (fl.idx + 1) + "/" + fl.queue.length;
  }
  $("flashCard").addEventListener("click", () => $("flashCard").classList.toggle("flipped"));
  $("flashNext").addEventListener("click", () => {
    if (fl.queue.length) { fl.idx = (fl.idx + 1) % fl.queue.length; flashShow(); }
  });
  $("flashPrev").addEventListener("click", () => {
    if (fl.queue.length) { fl.idx = (fl.idx - 1 + fl.queue.length) % fl.queue.length; flashShow(); }
  });
  $("flashStart").addEventListener("click", flashStart);

  // ---------- Init ----------
  loadColNames();
  renderList();
})();
</script>
</body>
</html>
